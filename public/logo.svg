<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <!-- Logo Emblem Container -->
  <g transform="translate(60, 50)">
    <rect width="300" height="300" rx="80" fill="url(#logoBg)" />
    <rect x="12" y="12" width="276" height="276" rx="68" fill="#0f172a" />
    <path d="M150 60v180" stroke="#ffffff" stroke-width="32" stroke-linecap="round" />
    <path d="M70 60h160" stroke="#ffffff" stroke-width="32" stroke-linecap="round" />
    <polygon points="220,130 238,148 220,166 202,148" fill="#818cf8" />
    <polygon points="80,180 94,194 80,208 66,194" fill="#34d399" />
  </g>

  <!-- Brand Name Typography (Visible on Light/White Backgrounds) -->
  <text x="400" y="240" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="145" fill="url(#textGrad)" letter-spacing="-4">Toolifia</text>

  <!-- .AI Tag -->
  <rect x="955" y="110" width="105" height="55" rx="16" fill="#4f46e5" />
  <text x="975" y="150" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#ffffff" letter-spacing="1">.AI</text>
</svg>
