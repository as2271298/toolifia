<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="innerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Gradient Border Container -->
  <rect width="512" height="512" rx="140" fill="url(#logoBg)" />

  <!-- Inner Slate Background -->
  <rect x="16" y="16" width="480" height="480" rx="124" fill="url(#innerBg)" />

  <!-- Stylized T Mark -->
  <g filter="url(#glow)">
    <!-- T Main Pillars -->
    <path d="M256 100v312" stroke="#ffffff" stroke-width="48" stroke-linecap="round" />
    <path d="M120 100h272" stroke="#ffffff" stroke-width="48" stroke-linecap="round" />

    <!-- AI Sparkles -->
    <polygon points="384,210 410,236 384,262 358,236" fill="#818cf8" />
    <polygon points="128,300 148,320 128,340 108,320" fill="#a7f3d0" />
  </g>
</svg>
